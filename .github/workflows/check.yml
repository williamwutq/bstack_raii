name: Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Clippy (fault-injection)
      run: cargo clippy --workspace --all-targets --features fault-injection -- -D warnings
    # trybuild compile-fail cases run only here (stable), where their `.stderr`
    # snapshots were generated — beta/nightly diagnostics would drift them.
    - name: Compile-fail tests (trybuild)
      run: cargo test --test hypercube compile_fail
