name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Trim nightly on Windows to keep the matrix lean (as bstack does).
          - os: windows-latest
            rust: nightly
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    # The trybuild compile-fail UI tests (`compile_fail`) are toolchain-sensitive —
    # their committed `.stderr` snapshots track one compiler's exact diagnostics and
    # drift across compiler versions, so CI does not run them: every `Test` step skips
    # them. Run them locally with `cargo test --test hypercube compile_fail`.
    - name: Check
      run: cargo check --workspace --all-targets
    - name: Test
      run: cargo test --workspace -- --skip compile_fail
    - name: Test (release)
      run: cargo test --workspace --release -- --skip compile_fail
    - name: Test (fault-injection)
      run: cargo test --workspace --features fault-injection -- --skip compile_fail
