[package]
name = "bstack_raii"
version = "0.0.0"
edition = "2024"
authors = ["William Wu <williamwutq@gmail.com>", "Claude <claude@anthropic.com>"]
license = "MIT"
description = "Typed, RAII-style ownership and lifetime layer over the bstack allocation primitives"
repository = "https://github.com/williamwutq/bstack_raii"
publish = false

# A standalone Cargo workspace: the `bstack_raii` library plus its `derive`
# proc-macro crate. Extracted from the `bstack` monorepo; it depends on `bstack`
# from crates.io, not on a sibling path.
[workspace]
members = ["derive"]

[features]
# Dev/test only: forwards bstack's fault-injection so crash-recovery tests can arm
# a fault at a chosen `BStack` op (e.g. the clone commit's `inplace_gen`). Off by
# default; enable with `--features fault-injection`. Also requires a debug build.
fault-injection = ["bstack/fault-injection"]

[dependencies]
# RAII requires `alloc` + `set`; `atomic` is needed for the on-disk refcount RMW
# (control blocks, strong/weak counters).
bstack = { version = "=0.4", features = ["alloc", "set", "atomic"] }
bstack_raii_derive = { path = "derive", version = "0.0.0" }

# Gate for POD (plain-old-data) inline fields: any `bytemuck::Pod` type is safe
# to store inline in an on-disk block and receives the blanket no-op BStackDrop.
bytemuck = { version = "=1.25", features = ["derive"] }
parking_lot = "0.12.5"

# RTTI type registration: `#[bstack_class]` emits a link-time entry per type into
# a distributed slice, so `rtti::sync` can enumerate every compiled-in schema with
# no life-before-main (unlike `inventory`'s `ctor`) and no instantiation required.
linkme = "0.3"

[dev-dependencies]
# Compile-fail (`tests/hypercube/ui/*.rs`): asserts each illegal macro input fails
# with the *right* error, keeping the negative cases out of lib.rs doctests.
trybuild = "1"
